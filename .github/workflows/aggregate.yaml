name: Aggregate APT repo

# Single-writer, pull-based aggregator: downloads .deb release assets from the
# org repos listed in repos.yaml (public releases - no cross-repo credentials),
# regenerates and signs the flat-repo index, and pushes to this repo's own
# gh-pages branch, served at https://apt.l337.org/. Producing projects never
# push here; they just publish GitHub Releases with a .deb asset.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    # 15 minutes against a job that normally finishes in under 40 seconds: enough
    # headroom that it cannot fire on a slow-but-working run, while bounding a hang to
    # one skipped cycle. A hang used to sit until GitHub's 6-hour default. A job killed
    # by this timeout reports `conclusion: cancelled`, NEVER `failure` and never
    # `timed_out`, so on its own it raises no workflow-failure notification and is
    # invisible to any sweep keyed on failed runs. The guard job at the end of this
    # file converts that cancellation into a real failure, which is what actually
    # makes the hang reportable.
    timeout-minutes: 15
    env:
      APT_GNUPGHOME: /tmp/gnupg-apt
      COMMIT_SIGNING_GNUPGHOME: /tmp/gnupg-commit
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main (config + templates)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main

      - name: Check out gh-pages (the published repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Install apt repo tooling
        # dpkg-dev: dpkg-scanpackages. apt-utils: apt-ftparchive. python3-yaml:
        # sync-debs.py's config parsing. Named explicitly rather than relying on
        # whatever the ubuntu-latest image happens to preinstall.
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg python3-yaml

      - name: Sync .deb files from source repos' GitHub Releases
        run: python3 main/scripts/sync-debs.py --repos-config main/repos.yaml --dest gh-pages

      - name: Copy in templates (CNAME, keyrings, index.html, README)
        run: cp -a main/templates/. gh-pages/

      # Regenerated on EVERY run, before change detection, so that a change to how the
      # index is built reaches the published repo on the next run instead of waiting for
      # an unrelated .deb or template to change. Needs no secrets - signing is separate.
      - name: Regenerate the index (unsigned)
        working-directory: gh-pages
        run: ../main/scripts/build-index.sh

      - name: Detect changes
        id: detect
        working-directory: gh-pages
        run: ../main/scripts/detect-changes.sh

      - name: Import APT signing key
        if: steps.detect.outputs.changed == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY secret is not set." >&2
            exit 1
          fi
          mkdir -m 700 "$APT_GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | base64 -d | GNUPGHOME="$APT_GNUPGHOME" gpg --batch --import

      # Sign only - the index was already generated above. Regenerating it here would
      # re-stamp Release with a new Date: after detection had settled, defeating the point.
      - name: Sign the index
        if: steps.detect.outputs.changed == 'true'
        working-directory: gh-pages
        env:
          GNUPGHOME: ${{ env.APT_GNUPGHOME }}
        run: |
          gpg --batch --yes -abs -o Release.gpg Release
          gpg --batch --yes --clearsign -o InRelease Release

      - name: Import commit-signing key
        if: steps.detect.outputs.changed == 'true'
        env:
          CI_COMMIT_SIGNING_KEY: ${{ secrets.CI_COMMIT_SIGNING_KEY }}
        run: |
          if [ -z "$CI_COMMIT_SIGNING_KEY" ]; then
            echo "::error::CI_COMMIT_SIGNING_KEY secret is not set - required by the" \
                 "gh-pages ruleset's signed-commits rule." >&2
            exit 1
          fi
          mkdir -m 700 "$COMMIT_SIGNING_GNUPGHOME"
          printf '%s' "$CI_COMMIT_SIGNING_KEY" | base64 -d | GNUPGHOME="$COMMIT_SIGNING_GNUPGHOME" gpg --batch --import

      - name: Commit and push
        if: steps.detect.outputs.changed == 'true'
        working-directory: gh-pages
        env:
          # git invokes gpg to sign the commit - point it at the isolated keyring
          # so it can only ever use the commit-signing key, never the APT key.
          GNUPGHOME: ${{ env.COMMIT_SIGNING_GNUPGHOME }}
          COMMIT_SIGNING_EMAIL: ${{ vars.COMMIT_SIGNING_EMAIL }}
          COMMIT_SIGNING_KEY_FINGERPRINT: ${{ vars.COMMIT_SIGNING_KEY_FINGERPRINT }}
        run: |
          if [ -z "$COMMIT_SIGNING_EMAIL" ] || [ -z "$COMMIT_SIGNING_KEY_FINGERPRINT" ]; then
            echo "::error::COMMIT_SIGNING_EMAIL and/or COMMIT_SIGNING_KEY_FINGERPRINT repo" \
                 "variable is not set." >&2
            exit 1
          fi
          # GitHub's "verified signature" check requires the commit email to match a
          # verified email on the account the signing key is registered to.
          git config user.name "github-actions[bot]"
          git config user.email "$COMMIT_SIGNING_EMAIL"
          git config user.signingkey "$COMMIT_SIGNING_KEY_FINGERPRINT"
          git config commit.gpgsign true
          git add -A
          git commit -m "Aggregate APT repo contents"
          git push origin gh-pages

  # A hang that rides out `timeout-minutes` reports `conclusion: cancelled`, not
  # `failure`, so GitHub raises no workflow-failure notification and a sweep keyed on
  # failed runs cannot see it. That is not theoretical: this workflow's `Install apt
  # repo tooling` step hung five times in ~16.5 hours in August 2026, and every one of
  # those occurrences had to be found by reading the run list by hand. This job closes
  # that gap - it turns the cancellation into a real failure, so the run notifies and
  # shows up as failed like any other.
  #
  # Safe here because `cancel-in-progress: false` above means nothing supersedes this
  # workflow: the only routes to `cancelled` are the timeout and a human pressing
  # cancel, and on an unattended scheduled publisher both are worth being told about.
  # `premerge.yaml` deliberately has no equivalent; see the note on its timeouts.
  report-cancelled-as-failure:
    name: Report a cancelled run as a failure
    needs: [aggregate]
    if: always() && needs.aggregate.result == 'cancelled'
    runs-on: ubuntu-latest
    # Nothing here but an annotation and a non-zero exit, so the timeout only has to
    # bound runner startup. It still needs one: the premerge guard requires every job
    # to declare `timeout-minutes`, and that check makes no exception for small jobs.
    timeout-minutes: 5
    steps:
      - name: Fail the run, because a cancellation would not notify
        run: |
          echo "::error::The aggregate job ended as cancelled, which is the conclusion a timeout-minutes kill produces. Failing this run so it raises a notification and appears in a failed-run sweep."
          exit 1
