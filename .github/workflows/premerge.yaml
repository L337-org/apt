name: 'Check inbound changes'

# This repo has no unit tests - it is one workflow, a config file and a template set.
# These checks exist so that a change here arrives with something to gate on. Before
# them, aggregate.yaml ran only on a schedule and on dispatch, so a pull request (a
# Dependabot action bump in particular) carried no status checks at all, and a bump that
# broke publishing would only surface on the next hourly run.
#
# The dry run deliberately stops short of signing and pushing: it calls the same
# scripts/ that the publishing run calls, but is never given the signing secrets, so it
# cannot touch gh-pages even by mistake.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-pins:
    name: Action pins are immutable
    runs-on: ubuntu-latest
    # 15 minutes against a job that normally finishes in under 40 seconds: enough
    # headroom that it cannot fire on a slow-but-working run, while bounding a hang to
    # one skipped cycle. A hang used to sit until GitHub's 6-hour default, and a
    # timeout registers as a FAILURE, so it produces the workflow-failure notification
    # that a silent stall never did.
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every third-party `uses:` must name a 40-hex commit SHA
        run: |
          # A tag or branch ref can be repointed by the action's owner at any time, and
          # the aggregate workflow imports both the APT signing key and the commit
          # signing key - so every third-party action is pinned to an immutable commit.
          # Dependabot bumps the SHA and rewrites the trailing "# vX.Y.Z" comment, so
          # pinning does not mean going stale. Local actions (./...) are exempt.
          #
          # Quoting is optional in YAML, so `uses: "owner/action@<sha>"` is exactly as
          # pinned as the bare form, and hex is case-insensitive, so an uppercase SHA is
          # equally pinned - GitHub resolves one (verified: both the commits and tarball
          # API endpoints answer 200 for an upper-cased SHA). All are accepted: a guard
          # that fails a legitimately pinned action is one someone eventually switches
          # off wholesale, which costs more than it ever caught. In practice every pin
          # here is lowercase, because that is what Dependabot writes - the point is that
          # the guard must not punish one that is not.
          bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows .github/actions 2>/dev/null \
                | grep -vE "uses:[[:space:]]*[\"']?\./" \
                | grep -vE "uses:[[:space:]]*[\"']?[^[:space:]\"']+@[0-9a-fA-F]{40}[\"']?([[:space:]]|\$)" \
                || true)
          if [ -n "$bad" ]; then
            echo "::error::Every third-party action must be pinned to a full 40-hex commit SHA." >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          echo "All action references are pinned to commit SHAs."

      - name: Install PyYAML
        # Declared rather than assumed. PyYAML happens to be present on today's ubuntu-latest, and
        # the guard below passed on it, but this repo's convention is to name what it needs instead
        # of relying on whatever the image preinstalls - the same reason sync-guard and
        # aggregate-dry-run install it explicitly. A guard that works by luck of the image is a
        # guard that stops working on an image refresh, silently, since a missing import would fail
        # the job rather than skip the check - but on a schedule nobody chose.
        #
        # This makes a fourth job run apt-get install, which is where the hang that prompted this
        # change happened. That is acceptable precisely because of this change: the timeout added
        # here bounds it to 15 minutes instead of six hours.
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Every job must declare a timeout
        # Same shape as the pin guard above, and in this job rather than a new one so it needs no
        # new required check. Without a timeout a job inherits GitHub's 6-hour default: a hang in
        # the hourly publisher stalled the channel for six hours and silently cancelled every run
        # queued behind it, reporting nothing, because a stall is not a failure. Four of these
        # jobs run apt-get install on the runner, which is where that hang happened, so the
        # property is enforced rather than remembered.
        #
        # Note the job name still says only "Action pins are immutable" - it is a required check
        # on main, so renaming it would break the ruleset until the new name were added there.
        run: |
          python3 - <<'CHECK'
          import pathlib, sys, yaml

          missing = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              # `or {}` because safe_load returns None for an empty or comment-only file, and a
              # traceback is never the right output for a guard - the same mistake this repo
              # already fixed in sync-debs.py, repeated here and caught in review.
              try:
                  document = yaml.safe_load(path.read_text()) or {}
              except yaml.YAMLError as exc:
                  print(f"::error::{path.name} is not valid YAML, so its jobs cannot be checked:")
                  print(f"  {exc}")
                  sys.exit(1)
              for name, job in (document.get("jobs") or {}).items():
                  if "timeout-minutes" not in job:
                      missing.append(f"{path.name}: {name}")

          if missing:
              print("::error::Every job must declare timeout-minutes, or it inherits GitHub's"
                    " 6-hour default and a hang goes unreported.")
              for entry in missing:
                  print(f"  {entry}")
              sys.exit(1)
          print("Every job declares timeout-minutes.")
          CHECK

  change-detection:
    name: Change detection behaves
    runs-on: ubuntu-latest
    # 15 minutes against a job that normally finishes in under 40 seconds: enough
    # headroom that it cannot fire on a slow-but-working run, while bounding a hang to
    # one skipped cycle. A hang used to sit until GitHub's 6-hour default, and a
    # timeout registers as a FAILURE, so it produces the workflow-failure notification
    # that a silent stall never did.
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test detect-changes.sh against synthetic repos
        # Needs only git - the fixtures fabricate Packages/Release rather than running
        # dpkg-scanpackages. The two negative cases are the load-bearing ones: a detector
        # that cannot say "no" makes the aggregator sign and push an identical repo every
        # hour, and one that cannot say "yes" is how an index-generation change went
        # unpublished in the first place.
        run: scripts/test-detect-changes.sh

  index-guard:
    name: Index guard refuses a malformed Release
    runs-on: ubuntu-latest
    # 15 minutes against a job that normally finishes in under 40 seconds: enough
    # headroom that it cannot fire on a slow-but-working run, while bounding a hang to
    # one skipped cycle. A hang used to sit until GitHub's 6-hour default, and a
    # timeout registers as a FAILURE, so it produces the workflow-failure notification
    # that a silent stall never did.
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test build-index.sh against a deliberately broken generator
        # Needs neither dpkg nor apt-utils - the suite stubs both, so it runs here and on a
        # developer machine alike. Separate from aggregate-dry-run on purpose: that job proves
        # the guard ACCEPTS a real index, and this one proves it still REJECTS a bad one. A
        # guard that has quietly stopped firing is indistinguishable from a passing guard in
        # the dry run, which is precisely the gap this closes.
        run: scripts/test-build-index.sh

  sync-guard:
    name: Sync refuses to prune on an empty result
    runs-on: ubuntu-latest
    # 15 minutes against a job that normally finishes in under 40 seconds: enough
    # headroom that it cannot fire on a slow-but-working run, while bounding a hang to
    # one skipped cycle. A hang used to sit until GitHub's 6-hour default, and a
    # timeout registers as a FAILURE, so it produces the workflow-failure notification
    # that a silent stall never did.
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        # sync-debs.py parses repos.yaml, so the suite needs the same dependency the publishing
        # job installs. Nothing else: `gh` is stubbed and download URLs are file:// URLs, so the
        # tests need neither network nor credentials.
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Test sync-debs.py against a stubbed GitHub API
        # The load-bearing case is multi-repo. The prune guard was global, which is
        # indistinguishable from a per-repo guard while one repo is configured and silently
        # unsafe once a second is added - one repo returning nothing would have pruned that
        # project's packages and pushed it as a normal publish. aggregate-dry-run cannot catch
        # that, because repos.yaml has a single entry.
        run: scripts/test-sync-debs.sh

  aggregate-dry-run:
    name: Aggregate dry run (no signing, no push)
    runs-on: ubuntu-latest
    # 15 minutes against a job that normally finishes in under 40 seconds: enough
    # headroom that it cannot fire on a slow-but-working run, while bounding a hang to
    # one skipped cycle. A hang used to sit until GitHub's 6-hour default, and a
    # timeout registers as a FAILURE, so it produces the workflow-failure notification
    # that a silent stall never did.
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main

      - name: Install apt repo tooling
        # dpkg-dev: dpkg-scanpackages. apt-utils: apt-ftparchive. python3-yaml:
        # sync-debs.py's config parsing. Named explicitly rather than relying on
        # whatever the ubuntu-latest image happens to preinstall.
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg python3-yaml

      - name: Sync .deb files into a scratch directory
        run: |
          mkdir -p scratch
          python3 main/scripts/sync-debs.py --repos-config main/repos.yaml --dest scratch

      - name: Copy in templates (CNAME, keyrings, index.html, README)
        run: cp -a main/templates/. scratch/

      - name: Regenerate the index (unsigned)
        working-directory: scratch
        run: ../main/scripts/build-index.sh

      - name: The generated index must list at least one package record
        working-directory: scratch
        run: |
          # Guards against the index generating "successfully" but empty, which would
          # publish a repo that resolves for clients and offers them nothing.
          #
          # Count records and distinct names separately. Under --multiversion each
          # retained version gets its own stanza, so a `^Package:` count is a count of
          # RECORDS, not of packages: five stanzas of one package at five versions is the
          # normal case here, and calling that "5 packages" would misread the index.
          # Both numbers are logged because their ratio is what shows --multiversion
          # actually took effect.
          records=$(grep -c '^Package: ' Packages || true)
          names=$(grep '^Package: ' Packages | sort -u | wc -l | tr -d ' ')
          if [ "${records:-0}" -lt 1 ]; then
            echo "::error::Generated Packages index contains no package records." >&2
            exit 1
          fi
          echo "Index lists ${records} package record(s) covering ${names} distinct package name(s)."
