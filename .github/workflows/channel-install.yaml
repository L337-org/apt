name: Channel install check

# Installs from the published channel the way a user would, on a clean machine.
#
# Everything else that watches this channel inspects it rather than using it: the daily
# external check verifies expected versions, sizes, hashes and both signatures without ever
# running an apt client, and premerge's aggregate-dry-run builds an index in a scratch
# directory without ever installing from the published one. So the property users actually
# depend on - that a clean machine given only the documented two-line setup can fetch and
# install what the channel advertises - was the one thing nothing checked. It was answered by
# hand during the investigation of the Release self-entry bug, which is what prompted this.
#
# It lives here rather than in each producing project deliberately: the channel is what is
# under test, this repo is its single writer, and a copy per producer would be duplicated
# tests of infrastructure those repos do not control. Upgrade testing is the opposite case and
# deliberately NOT here - upgrading from the previous release exercises a package's own
# maintainer scripts, which belong with the code that produces them.
#
# No secrets, and no write permission: it only reads a public channel.

on:
  schedule:
    # Offset from the daily external channel check so the two do not report at once.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-install
  cancel-in-progress: false

jobs:
  install-from-channel:
    name: Install on a clean Debian container
    runs-on: ubuntu-latest
    # 15 minutes against a job that normally finishes in under 40 seconds: enough
    # headroom that it cannot fire on a slow-but-working run, while bounding a hang to
    # one skipped cycle. A hang used to sit until GitHub's 6-hour default. A job killed
    # by this timeout reports `conclusion: cancelled`, NEVER `failure` and never
    # `timed_out`, so on its own it raises no workflow-failure notification and is
    # invisible to any sweep keyed on failed runs. The guard job at the end of this
    # file converts that cancellation into a real failure, which is what actually
    # makes the hang reportable.
    timeout-minutes: 15
    steps:
      - name: Install every package the channel advertises
        # A container rather than the runner itself: the runner already has apt sources,
        # keyrings and packages of its own, so an install there would not answer the question
        # asked. debian:stable-slim is as close to a clean machine as this can get cheaply.
        #
        # The setup commands are the ones README.md documents. That is a deliberate
        # duplication of two lines, and it can drift from the README - flagged rather than
        # solved here, since the alternative (extracting them from the README at run time)
        # trades a visible duplication for a fragile parser.
        #
        # On failure this job simply fails, and GitHub's own workflow-failure notification is
        # the alert. Filing a deduplicated issue was considered and rejected as unnecessary
        # given that notification already exists; recorded so it is not re-litigated as an
        # oversight.
        run: |
          docker run --rm --env DEBIAN_FRONTEND=noninteractive debian:stable-slim bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates gnupg >/dev/null

            # Every fetch from the channel goes through here. A single refused connection is not
            # a finding: the runner egress and the published channel are both remote, both are
            # occasionally unreachable for a few seconds, and a check that fails the whole run on
            # one of those reports a blip as a broken channel - which is worse than useless,
            # because it trains whoever reads it to ignore the alert. Three attempts with a short
            # backoff, each logged, failing only when all three fail: a real outage still fails
            # the run, a blip costs three lines in the log. The transport is what is being
            # tolerated, so the retry wraps the fetch and nothing further - every check after a
            # successful fetch is about what the channel served, and retrying those would hide
            # exactly the faults this job exists to catch.
            #
            # Written with explicit `if` blocks rather than `&&` lists: under `set -e` a failing
            # test as the last command of an `&&` list terminates the script, which would turn
            # "attempt 1 of 3 failed" into an immediate exit and silently undo the retry.
            fetch_from_channel() {
              url="$1"
              dest="$2"
              attempt=1
              while :; do
                status=0
                curl -fsSL --max-time 30 "$url" -o "$dest" || status=$?
                if [ "$status" -eq 0 ]; then
                  return 0
                fi
                echo "attempt $attempt of 3 fetching $url failed: curl exited $status" >&2
                if [ "$attempt" -ge 3 ]; then
                  return "$status"
                fi
                attempt=$((attempt + 1))
                sleep $((attempt * 5))
              done
            }

            if ! fetch_from_channel https://apt.l337.org/l337-apt.gpg /usr/share/keyrings/l337-apt.gpg; then
              echo "::error::Could not fetch the channel signing key from" \
                   "https://apt.l337.org/l337-apt.gpg after three attempts. The channel was" \
                   "unreachable from this runner, which is NOT the same as the key being wrong or" \
                   "unpublished: check the channel is being served before reading this as a" \
                   "publishing failure." >&2
              exit 1
            fi
            echo "deb [signed-by=/usr/share/keyrings/l337-apt.gpg] https://apt.l337.org/ ./" \
                > /etc/apt/sources.list.d/l337-apt.list

            # Fetching InRelease and Packages here is the real test of the index: apt verifies
            # the signature against the keyring and checks Packages against the hashes in
            # Release, so a bad signature or a wrong hash fails at this line rather than being
            # reasoned about.
            #
            # A clean exit alone proves too little, because apt reports some unusable-repository
            # conditions as a warning while still exiting zero. So W:/E: lines are treated as
            # failures - and only those, rather than any stderr output at all, since unrelated
            # benign chatter on stderr would otherwise fail this job every night for no reason.
            # Any W:/E: is fatal, including one from Debian own repositories: a clean container
            # doing one update should produce none, so an unexpected warning is worth stopping
            # for. But the message must not claim the channel is at fault when the line came from
            # somewhere else - a nightly job that misattributes its own findings sends whoever
            # reads it to the wrong repository.
            apt-get update 2>/tmp/update.err || { cat /tmp/update.err >&2; exit 1; }
            if grep -qE "^(W|E):" /tmp/update.err; then
              if grep -qE "^(W|E):.*apt\.l337\.org" /tmp/update.err; then
                echo "::error::apt-get update reported problems against the channel:" >&2
              else
                echo "::error::apt-get update reported warnings or errors, none of them naming" \
                     "the channel - failing anyway, because a clean container should report none:" >&2
              fi
              cat /tmp/update.err >&2
              exit 1
            fi
            [ -s /tmp/update.err ] && cat /tmp/update.err >&2 || true

            # Take the package list from the channel index over HTTP, so every producing project
            # added to repos.yaml in future is covered without a second place to update here.
            #
            # Deliberately NOT read out of /var/lib/apt/lists. apt promises no storage format
            # for its lists, and in this very image it does not use the obvious one: Debian
            # container images ship /etc/apt/apt.conf.d/docker-gzip-indexes setting
            # Acquire::GzipIndexes "true", so the stored file is Packages.lz4, and a glob for the
            # uncompressed name matches nothing - failing the job while blaming the channel for a
            # bug in the checker. `apt-get indextargets` filtered on "Site:" was tried as the
            # replacement and returns nothing in this image either, so the apt-internal route was
            # abandoned for the source of truth. Both were verified in a container rather than
            # reasoned about.
            #
            # Nothing is lost by not reading the copy apt keeps: the apt-get update above already
            # proved apt fetched and verified this index, and the apt-cache policy check below
            # fails for any package apt did not take from it.

            # Fetched to a file, then parsed from the file, rather than piped straight into
            # `mapfile` through a process substitution. Bash discards the exit status of a
            # process substitution and neither `-e` nor `pipefail` reaches inside one, so that way
            # a curl that could not connect produced an empty list and this job reported that the
            # channel advertises no packages at all - blaming the channel for a fetch that never
            # happened, and sending whoever read it looking for a publishing bug that was not
            # there. Keep the two findings distinct: unreachable is not empty, and only one of
            # them is ours.
            if ! fetch_from_channel https://apt.l337.org/Packages /tmp/Packages; then
              echo "::error::Could not fetch the channel index from" \
                   "https://apt.l337.org/Packages after three attempts. The channel was" \
                   "unreachable from this runner, which is NOT the same as the channel being" \
                   "empty or mis-published: check it is being served before reading this as a" \
                   "publishing failure." >&2
              exit 1
            fi

            mapfile -t packages < <(awk "/^Package: /{print \$2}" /tmp/Packages | sort -u)
            if [ "${#packages[@]}" -eq 0 ]; then
              echo "::error::The channel index was fetched successfully but advertises no" \
                   "packages at all." >&2
              exit 1
            fi
            echo "Channel advertises ${#packages[@]} package(s): ${packages[*]}"

            for pkg in "${packages[@]}"; do
              echo "--- $pkg"
              apt-cache policy "$pkg"

              candidate=$(apt-cache policy "$pkg" | awk "/Candidate:/{print \$2}")
              if [ -z "$candidate" ] || [ "$candidate" = "(none)" ]; then
                echo "::error::$pkg is advertised by the channel but has no installable candidate." >&2
                exit 1
              fi

              # Having a candidate is not enough: it must be OUR candidate. If a package name
              # collides with one in Debian, or pinning changes, apt could satisfy the install
              # from elsewhere and this job would pass while never touching the channel - a
              # false pass, which is worse than a false failure because nobody investigates it.
              # --print-uris says exactly what apt would fetch, before anything is fetched.
              uris=$(apt-get install --print-uris -y "$pkg" 2>/dev/null || true)
              if ! printf %s "$uris" | grep -F "apt.l337.org" | grep -qF "/${pkg}_"; then
                echo "::error::$pkg would not be fetched from the channel - apt resolved it" \
                     "somewhere else, so this run would not have exercised the channel." >&2
                printf %s "$uris" | grep -F "/${pkg}_" >&2 || echo "  (no URI for $pkg at all)" >&2
                exit 1
              fi

              apt-get install -y -qq "$pkg" >/dev/null

              # The installed version must be the one the channel advertised. This is the check
              # that catches a channel serving something other than what its index claims -
              # the class of problem no amount of index inspection can rule out.
              installed=$(dpkg-query -W -f "\${Version}" "$pkg")
              if [ "$installed" != "$candidate" ]; then
                echo "::error::$pkg: channel advertised $candidate, installed $installed." >&2
                exit 1
              fi
              echo "$pkg $installed installed and matches the advertised candidate"
            done
          '

  # A hang that rides out `timeout-minutes` reports `conclusion: cancelled`, not
  # `failure`, so GitHub raises no workflow-failure notification and a sweep keyed on
  # failed runs cannot see it. That is not theoretical, though it was the hourly
  # aggregate workflow it happened to: its `Install apt repo tooling` step hung five
  # times in ~16.5 hours in August 2026, found only by reading the run list by hand.
  # This job installs packages on a runner the same way, so it is exposed to the same
  # hang, and it is just as unattended. This job closes that gap - it turns the
  # cancellation into a real failure, so the run notifies and shows up as failed.
  #
  # Safe here because `cancel-in-progress: false` above means nothing supersedes this
  # workflow: the only routes to `cancelled` are the timeout and a human pressing
  # cancel, and on an unattended scheduled publisher both are worth being told about.
  # `premerge.yaml` deliberately has no equivalent; see the note on its timeouts.
  report-cancelled-as-failure:
    name: Report a cancelled run as a failure
    needs: [install-from-channel]
    if: always() && needs.install-from-channel.result == 'cancelled'
    runs-on: ubuntu-latest
    # Nothing here but an annotation and a non-zero exit, so the timeout only has to
    # bound runner startup. It still needs one: the premerge guard requires every job
    # to declare `timeout-minutes`, and that check makes no exception for small jobs.
    timeout-minutes: 5
    steps:
      - name: Fail the run, because a cancellation would not notify
        run: |
          echo "::error::The install-from-channel job ended as cancelled, which is the conclusion a timeout-minutes kill produces. Failing this run so it raises a notification and appears in a failed-run sweep."
          exit 1
