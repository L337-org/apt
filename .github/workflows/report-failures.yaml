name: 'Report failures'

# Posts a failed run of a workflow named below, started by one of the events below, to Slack,
# through the shared reporter pinned here (architecture/ci.md).  This repository has no
# SLACK_WEBHOOK secret of its own, so the organisation's applies and the post goes to the
# organisation's channel.  GitHub reads this trigger only from the default branch.
on:
  workflow_run:
    workflows:
      - 'Aggregate APT repo'
      - 'Channel install check'
      - 'Check inbound changes'
    types: [completed]

permissions:
  # Both read by the shared reporter, which GitHub refuses to start without them: to name the
  # failed jobs and find a run that replaced a cancelled one, and to tell a tag from a branch.
  actions: read
  contents: read

jobs:
  slack:
    name: Report to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-failure.yaml@PIN
    with:
      events: '["schedule", "push", "release"]'
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
