name: 'Report failures'

# Posts a failed run of a workflow named below, started by one of the events below, to Slack,
# through the shared reporter at the version named here (architecture/ci.md).  It posts to the
# channel named below through the bot token in SLACK_BOT_TOKEN.  GitHub reads
# this trigger only from the default branch.
on:
  workflow_run:
    workflows:
      - 'Aggregate APT repo'
      - 'Channel install check'
      - 'Check inbound changes'
      - 'Code review'
      - 'Announce pull requests'
    types: [completed]

permissions:
  # Both read by the shared reporter, which GitHub refuses to start without them: to name the
  # failed jobs and find a run that replaced a cancelled one, and to tell a tag from a branch.
  actions: read
  contents: read

jobs:
  slack:
    name: Report to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-failure.yaml@v2
    with:
      channel: '#l337-org'
      events: '["schedule", "push", "release", "pull_request"]'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
